<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>bfxr sound library</title>
    <style>
      :root {
        --bg: #14121a;
        --panel: #1d1a26;
        --panel-2: #252131;
        --line: #322c42;
        --text: #ece8f5;
        --muted: #9b93b0;
        --accent: #ffb03a;
        --accent-2: #4ad4c0;
        --danger: #ff6b6b;
        --radius: 10px;
      }
      @media (prefers-color-scheme: light) {
        :root {
          --bg: #f6f4f0;
          --panel: #ffffff;
          --panel-2: #f0ecf6;
          --line: #ded8e8;
          --text: #241f2e;
          --muted: #6d6580;
          --accent: #d97f00;
          --accent-2: #128577;
        }
      }
      * { box-sizing: border-box; }
      body {
        margin: 0;
        background: var(--bg);
        color: var(--text);
        font: 15px/1.5 ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
      }
      header {
        display: flex;
        flex-wrap: wrap;
        gap: 12px;
        align-items: baseline;
        padding: 16px 20px;
        border-bottom: 1px solid var(--line);
        background: var(--panel);
      }
      h1 {
        margin: 0;
        font-size: 18px;
        letter-spacing: 0.02em;
        font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
      }
      h1 span { color: var(--accent); }
      .dir {
        color: var(--muted);
        font-size: 12px;
        font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
        overflow-wrap: anywhere;
      }
      .badge {
        margin-left: auto;
        font-size: 12px;
        padding: 3px 9px;
        border-radius: 999px;
        border: 1px solid var(--line);
        color: var(--muted);
        white-space: nowrap;
      }
      .badge.claude { color: var(--accent-2); border-color: var(--accent-2); }
      main { max-width: 1080px; margin: 0 auto; padding: 20px; }
      .card {
        background: var(--panel);
        border: 1px solid var(--line);
        border-radius: var(--radius);
        padding: 16px;
        margin-bottom: 16px;
      }
      .prompt-row { display: flex; gap: 8px; flex-wrap: wrap; }
      input, select, button, textarea {
        font: inherit;
        color: inherit;
        background: var(--panel-2);
        border: 1px solid var(--line);
        border-radius: 8px;
        padding: 9px 11px;
      }
      input:focus-visible, select:focus-visible, button:focus-visible {
        outline: 2px solid var(--accent);
        outline-offset: 1px;
      }
      #prompt { flex: 1 1 340px; }
      button { cursor: pointer; }
      button:hover:not(:disabled) { border-color: var(--accent); }
      button:disabled { opacity: 0.5; cursor: default; }
      .primary {
        background: var(--accent);
        border-color: var(--accent);
        color: #1b1206;
        font-weight: 600;
      }
      .chips { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 10px; }
      .chip {
        font-size: 13px;
        padding: 5px 10px;
        border-radius: 999px;
        background: transparent;
      }
      .hint { color: var(--muted); font-size: 13px; margin-top: 10px; }
      .hint.error { color: var(--danger); }
      .toolbar {
        display: flex;
        gap: 8px;
        flex-wrap: wrap;
        align-items: center;
        margin-bottom: 12px;
      }
      .toolbar .spacer { flex: 1; }
      label.toggle {
        display: inline-flex;
        gap: 6px;
        align-items: center;
        font-size: 13px;
        color: var(--muted);
      }
      .volume {
        display: inline-flex;
        gap: 8px;
        align-items: center;
        font-size: 13px;
        color: var(--muted);
      }
      .volume .mute {
        width: 28px;
        height: 28px;
        padding: 0;
        display: grid;
        place-items: center;
        border-radius: 8px;
        color: var(--muted);
      }
      .volume .mute.muted { color: var(--danger); }
      .volume input[type="range"] {
        width: 96px;
        height: 18px;
        margin: 0;
        padding: 0;
        background: transparent;
        border: none;
        border-radius: 0;
        accent-color: var(--accent);
        cursor: pointer;
      }
      .group-head {
        display: flex;
        align-items: center;
        gap: 10px;
        margin: 22px 0 8px;
        font-size: 13px;
        letter-spacing: 0.08em;
        text-transform: uppercase;
        color: var(--muted);
      }
      .group-head::after {
        content: "";
        flex: 1;
        height: 1px;
        background: var(--line);
      }
      .sound {
        display: flex;
        align-items: center;
        gap: 10px;
        flex-wrap: wrap;
        padding: 8px 10px;
        border: 1px solid var(--line);
        border-radius: var(--radius);
        background: var(--panel);
        margin-bottom: 6px;
      }
      .sound.playing { border-color: var(--accent); }
      .sound.fresh { border-color: var(--accent-2); }
      .play {
        width: 34px;
        height: 34px;
        border-radius: 50%;
        display: grid;
        place-items: center;
        padding: 0;
        flex: none;
      }
      canvas.wave { flex: none; border-radius: 4px; background: var(--panel-2); }
      .name { flex: 1 1 160px; min-width: 120px; padding: 6px 8px; }
      .group-input { flex: 0 1 130px; min-width: 90px; padding: 6px 8px; font-size: 13px; }
      .meta {
        flex: none;
        width: 116px;
        text-align: right;
        color: var(--muted);
        font-size: 12px;
        font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
      }
      .actions { display: flex; gap: 4px; flex: none; }
      .actions button, .actions a {
        width: 32px;
        height: 32px;
        display: grid;
        place-items: center;
        padding: 0;
        font-size: 14px;
        text-decoration: none;
        border: 1px solid var(--line);
        border-radius: 8px;
        background: var(--panel-2);
        color: inherit;
      }
      .actions .starred { color: var(--accent); }
      .actions .del:hover { border-color: var(--danger); color: var(--danger); }
      .empty { color: var(--muted); text-align: center; padding: 40px 0; }
      .spin { display: inline-block; animation: spin 1s linear infinite; }
      @keyframes spin { to { transform: rotate(360deg); } }
      @media (prefers-reduced-motion: reduce) { .spin { animation: none; } }

      /* ------------------------------------------------------------ editor */

      .overlay {
        position: fixed;
        inset: 0;
        z-index: 20;
        background: rgba(8, 6, 14, 0.66);
        display: grid;
        place-items: center;
        padding: 14px;
      }
      .overlay[hidden] { display: none; }
      .editor {
        width: min(1120px, 100%);
        max-height: calc(100vh - 28px);
        display: flex;
        flex-direction: column;
        background: var(--bg);
        border: 1px solid var(--line);
        border-radius: 12px;
        box-shadow: 0 24px 60px rgba(0, 0, 0, 0.45);
        overflow: hidden;
      }
      .ed-head, .ed-foot {
        display: flex;
        gap: 8px;
        align-items: center;
        flex-wrap: wrap;
        padding: 12px 14px;
        background: var(--panel);
      }
      .ed-head { border-bottom: 1px solid var(--line); }
      .ed-foot { border-top: 1px solid var(--line); }
      .ed-head .title {
        font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
        font-size: 12px;
        color: var(--muted);
        white-space: nowrap;
      }
      .ed-head .title b { color: var(--accent-2); font-weight: 600; }
      #ed-name { flex: 0 1 240px; min-width: 140px; }
      #ed-group { flex: 0 1 150px; min-width: 100px; }
      .ed-head .title { margin-right: auto; }
      .ed-close {
        width: 32px;
        height: 32px;
        padding: 0;
        display: grid;
        place-items: center;
        margin-left: auto;
      }
      .ed-body { overflow: auto; padding: 14px; }
      .ed-foot .spacer { flex: 1; }
      .ed-foot .hint { margin: 0; max-width: 44ch; overflow-wrap: anywhere; }
      .ed-foot a {
        text-decoration: none;
        color: inherit;
        background: var(--panel-2);
        border: 1px solid var(--line);
        border-radius: 8px;
        padding: 9px 11px;
      }
      .ed-foot a:hover { border-color: var(--accent); }

      /* Sliders on the left, square + controls on the right. `order` keeps the
         square first in source order, so it leads when this stacks on narrow
         screens. */
      .ed-body { display: flex; align-items: flex-start; gap: 12px; }
      .ed-side { order: 2; flex: 0 0 280px; }
      #ed-wave {
        display: block;
        width: 100%;
        aspect-ratio: 1 / 1;
        border: 1px solid var(--line);
        border-radius: 10px;
        background: var(--panel);
        cursor: pointer;
      }
      .scope {
        display: flex;
        gap: 10px;
        align-items: center;
        margin-top: 10px;
      }
      .scope .play {
        width: 40px;
        height: 40px;
        font-size: 15px;
        flex: none;
        background: var(--accent);
        border-color: var(--accent);
        color: #1b1206;
      }
      .readout {
        font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
        font-size: 11.5px;
        line-height: 1.35;
        color: var(--muted);
      }
      .readout b { color: var(--text); font-weight: 600; }
      .readout .warn { color: var(--accent); }
      .toggle.live { margin-top: 8px; }

      .ed-section {
        font-size: 10.5px;
        letter-spacing: 0.09em;
        text-transform: uppercase;
        color: var(--muted);
        margin: 10px 0 5px;
      }
      .waves {
        display: grid;
        grid-template-columns: repeat(3, minmax(0, 1fr));
        gap: 5px;
      }
      .waves button {
        padding: 6px 4px;
        font-size: 12px;
        background: var(--panel-2);
      }
      .waves button.on {
        background: var(--accent);
        border-color: var(--accent);
        color: #1b1206;
        font-weight: 600;
      }
      .ed-actions { display: flex; flex-wrap: wrap; gap: 5px; }
      .ed-actions button {
        flex: 1 1 auto;
        padding: 6px 8px;
        font-size: 12px;
      }
      .ed-actions .chip { flex: 0 0 auto; padding: 3px 8px; font-size: 11.5px; }
      .ed-actions.chips { margin-top: 0; }

      /* Balanced columns pack the panels tightly whatever their heights. */
      .pgroups {
        flex: 1 1 auto;
        min-width: 0;
        column-width: 230px;
        column-gap: 8px;
      }
      .pgroup {
        break-inside: avoid;
        -webkit-column-break-inside: avoid;
        margin: 0 0 8px;
        font-size: 12px;
        border: 1px solid var(--line);
        border-radius: 9px;
        background: var(--panel);
        padding: 7px 9px 2px;
      }
      .pgroup h3 {
        margin: 0 0 6px;
        font-size: 10px;
        letter-spacing: 0.08em;
        text-transform: uppercase;
        color: var(--muted);
        font-weight: 600;
      }
      .pgroup.inactive { opacity: 0.42; }
      .pgroup.inactive h3::after {
        content: " · square only";
        letter-spacing: 0;
        text-transform: none;
      }
      .param {
        display: grid;
        grid-template-columns: 1fr auto;
        align-items: baseline;
        gap: 0 6px;
        margin-bottom: 5px;
      }
      .param .label {
        font-size: 11px;
        line-height: 1.25;
        overflow-wrap: anywhere;
      }
      .param.changed .label { color: var(--accent-2); }
      .param output {
        font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
        font-size: 10px;
        color: var(--muted);
        cursor: pointer;
      }
      .param output:hover { color: var(--accent); }
      .param input[type="range"] {
        grid-column: 1 / -1;
        width: 100%;
        height: 14px;
        margin: 1px 0 0;
        padding: 0;
        background: transparent;
        border: none;
        border-radius: 0;
        accent-color: var(--accent);
        cursor: pointer;
      }

      @media (max-width: 720px) {
        .ed-body { flex-direction: column; }
        .ed-side { order: 0; flex: 1 1 auto; align-self: stretch; }
        #ed-wave { max-width: 300px; }
        .pgroups { align-self: stretch; }
      }
    </style>
  </head>
  <body>
    <header>
      <h1>bfxr<span>.</span>library</h1>
      <div class="dir" id="dir"></div>
      <div class="badge" id="designer"></div>
    </header>

    <main>
      <section class="card">
        <div class="prompt-row">
          <input
            id="prompt"
            placeholder="describe a sound — e.g. deep crunchy explosion, tiny UI blip, rising powerup"
            autocomplete="off"
          />
          <select id="count" title="How many variations">
            <option value="1">1</option>
            <option value="2">2</option>
            <option value="3">3</option>
            <option value="4" selected>4</option>
            <option value="6">6</option>
            <option value="8">8</option>
          </select>
          <input id="group" class="group-input" list="groups" placeholder="group" />
          <button class="primary" id="generate">Generate</button>
          <button id="new-sound" title="Build a sound from scratch in the editor">
            ✎ New
          </button>
          <button id="import" title="Open a bfxr.net link or .bfxr file">
            Open link…
          </button>
        </div>
        <div class="chips" id="presets"></div>
        <div class="hint" id="hint"></div>
      </section>

      <div class="toolbar">
        <input id="search" placeholder="filter…" autocomplete="off" />
        <select id="group-filter"><option value="">all groups</option></select>
        <button id="select-all">Select all</button>
        <button id="zip" disabled>Download .zip</button>
        <button id="bulk-group" disabled>Set group</button>
        <button id="bulk-delete" disabled>Delete</button>
        <span class="spacer"></span>
        <label class="toggle">
          <input type="checkbox" id="autoplay" checked /> auto-play new
        </label>
        <div class="volume">
          <button type="button" class="mute" id="mute" title="Mute">♪</button>
          <input
            type="range"
            id="volume"
            min="0"
            max="1"
            step="0.01"
            value="1"
            aria-label="Volume"
          />
        </div>
      </div>

      <div id="list"></div>
    </main>

    <datalist id="groups"></datalist>

    <div class="overlay" id="overlay" hidden>
      <section
        class="editor"
        role="dialog"
        aria-modal="true"
        aria-label="Sound editor"
      >
        <div class="ed-head">
          <input id="ed-name" placeholder="sound name" autocomplete="off" />
          <input
            id="ed-group"
            list="groups"
            placeholder="group"
            autocomplete="off"
          />
          <div class="title" id="ed-title"></div>
          <button class="ed-close" id="ed-close" title="Close (Esc)">✕</button>
        </div>

        <div class="ed-body">
          <!-- Floated, and first in source order, so the sliders fill the
               space beside it and then carry on underneath. -->
          <div class="ed-side">
            <canvas id="ed-wave"></canvas>
            <div class="scope">
              <button class="play" id="ed-play" title="Play (Space)">▶</button>
              <div class="readout" id="ed-readout"></div>
            </div>
            <label class="toggle live">
              <input type="checkbox" id="ed-live" checked /> play on change
            </label>

            <div class="ed-section">Waveform</div>
            <div class="waves" id="ed-waves"></div>

            <div class="ed-section">Shuffle</div>
            <div class="ed-actions">
              <button id="ed-random" title="Roll every parameter">Randomize</button>
              <button id="ed-mutate" title="Nudge every parameter a little">
                Mutate
              </button>
              <button id="ed-revert" title="Back to the last saved values">
                Revert
              </button>
              <button id="ed-default" title="Reset every parameter to its default">
                Defaults
              </button>
            </div>

            <div class="ed-section">Start from</div>
            <div class="ed-actions chips" id="ed-templates"></div>
          </div>

          <div class="pgroups" id="ed-params"></div>
        </div>

        <div class="ed-foot">
          <button class="primary" id="ed-save">Save changes</button>
          <button id="ed-saveas">Save as new</button>
          <span class="hint" id="ed-status"></span>
          <span class="spacer"></span>
          <a id="ed-download" download>↓ .wav</a>
          <button id="ed-copy" title="Copy the bfxr.net link">Copy link</button>
          <a id="ed-open" target="_blank" rel="noreferrer">bfxr.net ↗</a>
        </div>
      </section>
    </div>

    <script>
      const $ = (id) => document.getElementById(id);
      const audio = new Audio();
      const VOLUME_KEY = "bfxr-volume";
      let state = { sounds: [], groups: [], presets: [] };
      let selected = new Set();
      let fresh = new Set();
      let playingId = null;
      let queue = [];
      let lastVolume = 1;

      // Editor: a working copy of one sound, previewed straight from the synth.
      const preview = new Audio();
      const paramRows = new Map();
      let editor = null;
      let editorBuilt = false;
      let previewSound = null;
      let previewUrl = null;
      let previewTimer = null;
      let previewToken = 0;
      let previewPlay = false;
      let playhead = null;

      const randomSeed = () => Math.floor(Math.random() * 2 ** 31);

      /* ------------------------------------------------------------ api */

      async function api(path, options = {}) {
        const res = await fetch(path, {
          headers: { "content-type": "application/json" },
          ...options,
          body: options.body ? JSON.stringify(options.body) : undefined,
        });
        const data = await res.json().catch(() => ({}));
        if (!res.ok) throw new Error(data.error || `HTTP ${res.status}`);
        return data;
      }

      function applyState(next) {
        state = next;
        $("dir").textContent = state.output_dir;
        const claude = state.designer === "claude";
        $("designer").textContent = claude
          ? "prompts → Claude API"
          : "prompts → keyword mapper";
        $("designer").classList.toggle("claude", claude);
        renderPresets();
        renderGroups();
        render();
      }

      function librarySig(snapshot) {
        return (snapshot.sounds || [])
          .map((sound) =>
            [sound.id, sound.name, sound.group || "", sound.starred ? 1 : 0].join("\t"),
          )
          .join("\n");
      }

      function shouldSkipPoll() {
        if ($("generate").disabled) return true;
        if (editor) return true; // don't shuffle the list out from under the editor
        const el = document.activeElement;
        return Boolean(el && el.closest && el.closest(".sound"));
      }

      async function refresh() {
        applyState(await api("/api/state"));
      }

      async function pollLibrary() {
        if (shouldSkipPoll()) return;
        try {
          const next = await api("/api/state");
          if (librarySig(next) === librarySig(state)) return;
          const oldIds = new Set((state.sounds || []).map((sound) => sound.id));
          for (const sound of next.sounds) {
            if (!oldIds.has(sound.id)) fresh.add(sound.id);
          }
          applyState(next);
        } catch {
          /* library server may be restarting */
        }
      }

      /* --------------------------------------------------------- render */

      function renderPresets() {
        const wrap = $("presets");
        wrap.replaceChildren();
        for (const preset of state.presets) {
          const button = document.createElement("button");
          button.className = "chip";
          button.textContent = preset.replace(/_/g, " ");
          button.onclick = () => generate({ preset });
          wrap.append(button);
        }
      }

      function renderGroups() {
        const list = $("groups");
        list.replaceChildren();
        for (const group of state.groups) {
          const option = document.createElement("option");
          option.value = group;
          list.append(option);
        }
        const filter = $("group-filter");
        const current = filter.value;
        filter.replaceChildren(new Option("all groups", ""));
        for (const group of state.groups) filter.append(new Option(group, group));
        filter.value = state.groups.includes(current) ? current : "";
      }

      function visibleSounds() {
        const term = $("search").value.trim().toLowerCase();
        const group = $("group-filter").value;
        return state.sounds.filter((sound) => {
          if (group && sound.group !== group) return false;
          if (!term) return true;
          return [sound.name, sound.prompt, sound.preset, sound.wave_type]
            .filter(Boolean)
            .some((field) => field.toLowerCase().includes(term));
        });
      }

      function drawWave(canvas, peaks) {
        const scale = window.devicePixelRatio || 1;
        const width = 132;
        const height = 34;
        canvas.width = width * scale;
        canvas.height = height * scale;
        canvas.style.width = width + "px";
        canvas.style.height = height + "px";
        const ctx = canvas.getContext("2d");
        ctx.scale(scale, scale);
        const styles = getComputedStyle(document.body);
        ctx.strokeStyle = styles.getPropertyValue("--accent-2").trim();
        ctx.lineWidth = 1;
        const buckets = peaks.length / 2;
        const step = width / buckets;
        for (let i = 0; i < buckets; i++) {
          const min = peaks[i * 2];
          const max = peaks[i * 2 + 1];
          const x = Math.round(i * step) + 0.5;
          const y1 = height / 2 - (max * height) / 2;
          const y2 = height / 2 - (min * height) / 2;
          ctx.beginPath();
          ctx.moveTo(x, Math.min(y1, y2 - 0.5));
          ctx.lineTo(x, Math.max(y2, y1 + 0.5));
          ctx.stroke();
        }
      }

      function soundRow(sound) {
        const row = document.createElement("div");
        row.className = "sound";
        if (playingId === sound.id) row.classList.add("playing");
        if (fresh.has(sound.id)) row.classList.add("fresh");

        const check = document.createElement("input");
        check.type = "checkbox";
        check.checked = selected.has(sound.id);
        check.title = "Select";
        check.onchange = () => {
          if (check.checked) selected.add(sound.id);
          else selected.delete(sound.id);
          syncSelection();
        };

        const play = document.createElement("button");
        play.className = "play";
        play.textContent = playingId === sound.id ? "◼" : "▶";
        play.title = "Play";
        play.onclick = () => (playingId === sound.id ? stop() : playOne(sound.id));

        const canvas = document.createElement("canvas");
        canvas.className = "wave";
        drawWave(canvas, sound.peaks || []);
        canvas.onclick = () => playOne(sound.id);

        const name = document.createElement("input");
        name.className = "name";
        name.value = sound.name;
        name.onchange = () => patch(sound.id, { name: name.value.trim() });

        const group = document.createElement("input");
        group.className = "group-input";
        group.setAttribute("list", "groups");
        group.placeholder = "group";
        group.value = sound.group || "";
        group.onchange = () => patch(sound.id, { group: group.value.trim() });

        const meta = document.createElement("div");
        meta.className = "meta";
        meta.textContent = `${sound.duration.toFixed(2)}s · ${sound.wave_type}`;
        meta.title = sound.prompt
          ? `"${sound.prompt}" → ${sound.preset || "custom"}`
          : sound.preset || "custom";

        const actions = document.createElement("div");
        actions.className = "actions";

        const star = document.createElement("button");
        star.textContent = sound.starred ? "★" : "☆";
        star.title = "Keep";
        star.className = sound.starred ? "starred" : "";
        star.onclick = () => patch(sound.id, { starred: !sound.starred });

        const edit = document.createElement("button");
        edit.textContent = "✎";
        edit.title = "Open in the editor";
        edit.onclick = () => openEditor({ id: sound.id });

        const vary = document.createElement("button");
        vary.textContent = "↻";
        vary.title = "Make variations of this sound";
        vary.onclick = () => mutate(sound.id);

        const download = document.createElement("a");
        download.textContent = "↓";
        download.title = "Download .wav";
        download.href = `/api/audio/${encodeURIComponent(sound.id)}?download=1`;

        const open = document.createElement("a");
        open.textContent = "↗";
        open.title = "Open in bfxr.net to tweak by ear";
        open.target = "_blank";
        open.rel = "noreferrer";
        open.href = sound.permalink;

        const del = document.createElement("button");
        del.textContent = "✕";
        del.className = "del";
        del.title = "Delete";
        del.onclick = () => remove(sound.id);

        actions.append(star, edit, vary, download, open, del);
        row.append(check, play, canvas, name, group, meta, actions);
        return row;
      }

      function render() {
        const list = $("list");
        list.replaceChildren();
        const sounds = visibleSounds();

        if (sounds.length === 0) {
          const empty = document.createElement("div");
          empty.className = "empty";
          empty.textContent = state.sounds.length
            ? "Nothing matches that filter."
            : "No sounds yet — describe one above.";
          list.append(empty);
          syncSelection();
          return;
        }

        const byGroup = new Map();
        for (const sound of sounds) {
          const key = sound.group || "";
          if (!byGroup.has(key)) byGroup.set(key, []);
          byGroup.get(key).push(sound);
        }
        const keys = [...byGroup.keys()].sort((a, b) =>
          a === "" ? 1 : b === "" ? -1 : a.localeCompare(b),
        );

        for (const key of keys) {
          const head = document.createElement("div");
          head.className = "group-head";
          const label = document.createElement("span");
          label.textContent = key || "ungrouped";
          const zip = document.createElement("button");
          zip.className = "chip";
          zip.textContent = "zip";
          zip.title = "Download this group";
          zip.onclick = () =>
            downloadZip(byGroup.get(key).map((s) => s.id), key || "ungrouped");
          head.append(label, zip);
          list.append(head);
          for (const sound of byGroup.get(key)) list.append(soundRow(sound));
        }
        syncSelection();
      }

      function syncSelection() {
        // Drop selections for sounds that no longer exist.
        const alive = new Set(state.sounds.map((s) => s.id));
        for (const id of [...selected]) if (!alive.has(id)) selected.delete(id);
        const any = selected.size > 0;
        $("zip").disabled = !any;
        $("bulk-group").disabled = !any;
        $("bulk-delete").disabled = !any;
        $("zip").textContent = any
          ? `Download .zip (${selected.size})`
          : "Download .zip";
      }

      /* -------------------------------------------------------- playback */

      function readStoredVolume() {
        try {
          const stored = Number(localStorage.getItem(VOLUME_KEY));
          if (Number.isFinite(stored)) return Math.min(1, Math.max(0, stored));
        } catch {
          /* private mode / blocked storage */
        }
        return 1;
      }

      function setVolume(value, { persist = true } = {}) {
        const volume = Math.min(1, Math.max(0, Number(value) || 0));
        audio.volume = volume;
        preview.volume = volume;
        $("volume").value = String(volume);
        $("volume").title = `${Math.round(volume * 100)}%`;
        $("mute").classList.toggle("muted", volume === 0);
        $("mute").title = volume === 0 ? "Unmute" : "Mute";
        if (volume > 0) lastVolume = volume;
        if (persist) {
          try {
            localStorage.setItem(VOLUME_KEY, String(volume));
          } catch {
            /* ignore */
          }
        }
      }

      function stop() {
        audio.pause();
        queue = [];
        playingId = null;
        render();
      }

      function playOne(id) {
        queue = [];
        start(id);
      }

      function start(id) {
        preview.pause(); // never overlap the editor's preview
        playingId = id;
        audio.src = `/api/audio/${encodeURIComponent(id)}`;
        audio.play().catch(() => {});
        render();
      }

      audio.onended = () => {
        if (queue.length) start(queue.shift());
        else {
          playingId = null;
          render();
        }
      };

      function playSequence(ids) {
        if (!ids.length) return;
        queue = ids.slice(1);
        start(ids[0]);
      }

      /* ------------------------------------------------------- mutations */

      function setBusy(busy, message) {
        $("generate").disabled = busy;
        $("hint").className = "hint";
        $("hint").innerHTML = busy
          ? `<span class="spin">◐</span> ${message}`
          : message || "";
      }

      function showError(error) {
        $("generate").disabled = false;
        $("hint").className = "hint error";
        $("hint").textContent = error.message;
      }

      async function generate(extra = {}) {
        const prompt = $("prompt").value.trim();
        if (!prompt && !extra.preset) {
          $("prompt").focus();
          return;
        }
        setBusy(
          true,
          extra.preset ? `generating ${extra.preset}…` : "designing sound…",
        );
        try {
          const result = await api("/api/generate", {
            method: "POST",
            body: {
              prompt,
              count: Number($("count").value),
              group: $("group").value.trim(),
              ...extra,
            },
          });
          await afterGenerate(result);
        } catch (error) {
          showError(error);
        }
      }

      async function mutate(id) {
        setBusy(true, "making variations…");
        try {
          await afterGenerate(
            await api("/api/mutate", { method: "POST", body: { id, count: 3 } }),
          );
        } catch (error) {
          showError(error);
        }
      }

      async function afterGenerate(result) {
        const ids = result.sounds.map((s) => s.id);
        fresh = new Set(ids);
        await refresh();
        const bits = [`${ids.length} new`];
        if (result.rationale) bits.push(result.rationale);
        if (result.note) bits.push(result.note);
        setBusy(false, bits.join(" · "));
        if ($("autoplay").checked) playSequence(ids);
      }

      async function patch(id, changes) {
        try {
          await api(`/api/sounds/${encodeURIComponent(id)}`, {
            method: "PATCH",
            body: changes,
          });
          await refresh();
        } catch (error) {
          showError(error);
        }
      }

      async function remove(id) {
        try {
          await api(`/api/sounds/${encodeURIComponent(id)}`, { method: "DELETE" });
          selected.delete(id);
          if (playingId === id) stop();
          await refresh();
        } catch (error) {
          showError(error);
        }
      }

      function downloadZip(ids, name) {
        if (!ids.length) return;
        const query = new URLSearchParams({ ids: ids.join(","), name });
        window.location.href = `/api/zip?${query}`;
      }

      /* ---------------------------------------------------------- editor */

      /**
       * The editor keeps a working copy of one sound's parameters. Every change
       * is re-synthesized by the server (the same engine that writes the files),
       * so what you hear while dragging is exactly what gets saved.
       */
      function paramMeta(name) {
        return (state.parameters || []).find((p) => p.name === name);
      }

      function buildEditor() {
        if (editorBuilt || !state.parameters) return;

        const waves = $("ed-waves");
        waves.replaceChildren();
        for (const wave of paramMeta("waveType").values) {
          const button = document.createElement("button");
          button.textContent = wave.name;
          button.title = wave.description || "";
          button.dataset.index = wave.index;
          button.onclick = () => setParam("waveType", wave.index, { play: true });
          waves.append(button);
        }

        const templates = $("ed-templates");
        templates.replaceChildren();
        for (const preset of state.presets) {
          const button = document.createElement("button");
          button.className = "chip";
          button.textContent = preset.replace(/_/g, " ");
          button.title = `Replace every parameter with a fresh ${preset.replace(/_/g, " ")}`;
          button.onclick = () => rollParams({ action: "preset", preset });
          templates.append(button);
        }

        const wrap = $("ed-params");
        wrap.replaceChildren();
        paramRows.clear();
        for (const group of state.param_groups || []) {
          const box = document.createElement("div");
          box.className = "pgroup";
          if (group.requires_wave !== undefined) {
            box.dataset.requiresWave = group.requires_wave;
          }
          const heading = document.createElement("h3");
          heading.textContent = group.title;
          box.append(heading);
          for (const name of group.params) {
            const meta = paramMeta(name);
            if (!meta || meta.type !== "number") continue;
            box.append(paramRow(meta));
          }
          wrap.append(box);
        }
        editorBuilt = true;
      }

      function paramRow(meta) {
        const row = document.createElement("div");
        row.className = "param";

        const label = document.createElement("span");
        label.className = "label";
        label.textContent = meta.label;
        label.title = meta.description || "";

        const out = document.createElement("output");
        out.title = `Default ${meta.default} — click to reset`;
        out.onclick = () => setParam(meta.name, meta.default, { play: true });

        const slider = document.createElement("input");
        slider.type = "range";
        slider.min = meta.min;
        slider.max = meta.max;
        slider.step = 0.001;
        slider.title = meta.description || "";
        slider.setAttribute("aria-label", meta.label);
        // Dragging redraws the waveform; letting go is what plays it.
        slider.oninput = () => setParam(meta.name, Number(slider.value));
        slider.onchange = () => setParam(meta.name, Number(slider.value), { play: true });

        row.append(label, out, slider);
        paramRows.set(meta.name, { row, slider, out, meta });
        return row;
      }

      function setParam(name, value, { play = false } = {}) {
        if (!editor) return;
        const meta = paramMeta(name);
        let next = Number(value);
        if (!Number.isFinite(next)) return;
        if (meta) next = Math.min(meta.max, Math.max(meta.min, next));
        editor.params[name] = next;
        syncEditor();
        schedulePreview({ play });
      }

      function syncEditor() {
        if (!editor) return;
        const params = editor.params;

        for (const { row, slider, out, meta } of paramRows.values()) {
          const value = Number(params[meta.name] ?? meta.default);
          if (slider.value !== String(value)) slider.value = String(value);
          out.textContent = value.toFixed(3);
          row.classList.toggle("changed", Math.abs(value - meta.default) > 1e-6);
        }

        for (const button of $("ed-waves").children) {
          button.classList.toggle(
            "on",
            Number(button.dataset.index) === Number(params.waveType),
          );
        }
        for (const box of $("ed-params").children) {
          if (box.dataset.requiresWave === undefined) continue;
          box.classList.toggle(
            "inactive",
            Number(box.dataset.requiresWave) !== Number(params.waveType),
          );
        }

        $("ed-download").download = `${$("ed-name").value.trim() || "sound"}.wav`;

        const dirty = isDirty();
        $("ed-title").innerHTML = editor.id
          ? `editing <b>${escapeHtml(editor.id)}</b>${dirty ? " · unsaved" : ""}`
          : `new sound${dirty ? " · unsaved" : ""}`;
        $("ed-save").textContent = editor.id ? "Save changes" : "Save to library";
        $("ed-saveas").hidden = !editor.id;
        $("ed-revert").disabled = !dirty;
      }

      function escapeHtml(text) {
        const node = document.createElement("span");
        node.textContent = text;
        return node.innerHTML;
      }

      function isDirty() {
        if (!editor) return false;
        if (JSON.stringify(editor.params) !== editor.baseline) return true;
        if (!editor.id) return true;
        return (
          $("ed-name").value.trim() !== editor.name ||
          $("ed-group").value.trim() !== (editor.group || "")
        );
      }

      /* -------------------------------------------------- editor preview */

      function schedulePreview({ play = false, delay = 130 } = {}) {
        clearTimeout(previewTimer);
        previewPlay = previewPlay || play;
        previewTimer = setTimeout(() => {
          const shouldPlay = previewPlay;
          previewPlay = false;
          renderPreview({ play: shouldPlay });
        }, delay);
      }

      async function renderPreview({ play = false } = {}) {
        if (!editor) return;
        const token = ++previewToken;
        try {
          const result = await api("/api/preview", {
            method: "POST",
            body: {
              params: editor.params,
              seed: editor.seed ?? undefined,
              name: $("ed-name").value.trim() || editor.name,
            },
          });
          // A newer edit may have landed while this one was rendering.
          if (token !== previewToken || !editor) return;
          previewSound = result;
          drawScope();
          updateReadout();

          if (result.silent) {
            setPreviewSrc(null);
            return;
          }
          setPreviewSrc(result.wav);
          if (play && $("ed-live").checked) playPreview();
        } catch (error) {
          if (token === previewToken) editorStatus(error.message, true);
        }
      }

      function setPreviewSrc(base64) {
        if (previewUrl) URL.revokeObjectURL(previewUrl);
        previewUrl = null;
        if (!base64) {
          preview.removeAttribute("src");
          return;
        }
        const binary = atob(base64);
        const bytes = new Uint8Array(binary.length);
        for (let i = 0; i < binary.length; i++) bytes[i] = binary.charCodeAt(i);
        previewUrl = URL.createObjectURL(new Blob([bytes], { type: "audio/wav" }));
        preview.src = previewUrl;

        const download = $("ed-download");
        download.href = previewUrl;
        download.download = `${$("ed-name").value.trim() || "sound"}.wav`;
        $("ed-open").href = previewSound.permalink || "#";
      }

      function playPreview() {
        if (!previewUrl) return;
        audio.pause(); // the library player yields to the editor
        queue = [];
        preview.currentTime = 0;
        preview.play().catch(() => {});
        if (!playhead) playhead = requestAnimationFrame(tickPlayhead);
      }

      function tickPlayhead() {
        playhead = null;
        if (!editor) return;
        drawScope();
        if (!preview.paused) playhead = requestAnimationFrame(tickPlayhead);
      }

      preview.onended = () => {
        $("ed-play").textContent = "▶";
        drawScope();
      };
      preview.onplay = () => {
        $("ed-play").textContent = "◼";
      };
      preview.onpause = () => {
        $("ed-play").textContent = "▶";
      };

      function updateReadout() {
        if (!previewSound) return;
        $("ed-readout").innerHTML = previewSound.silent
          ? '<span class="warn">silent — raise Sustain or Decay Time</span>'
          : `<b>${previewSound.duration.toFixed(2)}s</b> · ${previewSound.wave_type} · 44.1kHz`;
      }

      function drawScope() {
        const canvas = $("ed-wave");
        const scale = window.devicePixelRatio || 1;
        const width = canvas.clientWidth || 600;
        const height = canvas.clientHeight || 128;
        canvas.width = Math.round(width * scale);
        canvas.height = Math.round(height * scale);
        const ctx = canvas.getContext("2d");
        ctx.setTransform(scale, 0, 0, scale, 0, 0);
        ctx.clearRect(0, 0, width, height);

        const styles = getComputedStyle(document.body);
        ctx.strokeStyle = styles.getPropertyValue("--line").trim();
        ctx.lineWidth = 1;
        // Centre line, plus faint half-amplitude guides so the square reads as a scope.
        for (const at of [0.25, 0.5, 0.75]) {
          const y = Math.round(height * at) + 0.5;
          ctx.globalAlpha = at === 0.5 ? 1 : 0.4;
          ctx.beginPath();
          ctx.moveTo(0, y);
          ctx.lineTo(width, y);
          ctx.stroke();
        }
        ctx.globalAlpha = 1;

        const peaks = (previewSound && previewSound.peaks) || [];
        const buckets = peaks.length / 2;
        if (buckets) {
          ctx.fillStyle = styles.getPropertyValue("--accent-2").trim();
          const step = width / buckets;
          for (let i = 0; i < buckets; i++) {
            const top = (height / 2) * (1 - peaks[i * 2 + 1] * 0.94);
            const bottom = (height / 2) * (1 - peaks[i * 2] * 0.94);
            ctx.fillRect(i * step, top, Math.max(1, step - 0.4), Math.max(1, bottom - top));
          }
        }

        if (previewSound && previewSound.duration && !preview.paused) {
          const at = Math.min(1, preview.currentTime / previewSound.duration);
          ctx.strokeStyle = styles.getPropertyValue("--accent").trim();
          ctx.lineWidth = 2;
          ctx.beginPath();
          ctx.moveTo(at * width, 0);
          ctx.lineTo(at * width, height);
          ctx.stroke();
        }
      }

      /* ------------------------------------------------ editor lifecycle */

      function editorStatus(message, isError = false) {
        $("ed-status").textContent = message || "";
        $("ed-status").className = isError ? "hint error" : "hint";
      }

      /**
       * @param {object} [source] `{ id }` to edit a library sound, `{ name,
       * params }` for an imported one, or nothing for a blank sound.
       */
      async function openEditor(source = {}) {
        buildEditor();
        try {
          const entry = source.id
            ? await api(`/api/sounds/${encodeURIComponent(source.id)}`)
            : null;

          editor = {
            id: entry ? entry.id : null,
            name: entry ? entry.name : source.name || "sound",
            group: entry ? entry.group || "" : $("group").value.trim(),
            preset: entry ? entry.preset || "" : "",
            seed: entry ? (entry.seed ?? null) : randomSeed(),
            params: { ...(entry ? entry.params : source.params || state.defaults) },
          };
          editor.baseline = JSON.stringify(editor.params);

          $("ed-name").value = editor.name;
          $("ed-group").value = editor.group;
          $("overlay").hidden = false;
          previewSound = null;
          editorStatus("");
          audio.pause();
          queue = [];
          syncEditor();
          drawScope();
          renderPreview();
          $("ed-play").focus();
        } catch (error) {
          showError(error);
        }
      }

      function closeEditor({ force = false } = {}) {
        if (!editor) return;
        if (!force && isDirty() && !confirm("Discard unsaved changes?")) return;
        preview.pause();
        if (previewUrl) URL.revokeObjectURL(previewUrl);
        previewUrl = null;
        previewSound = null;
        previewToken++;
        clearTimeout(previewTimer);
        editor = null;
        $("overlay").hidden = true;
        refresh().catch(showError);
      }

      /** Ask the server for a preset / randomized / mutated parameter set. */
      async function rollParams(body) {
        if (!editor) return;
        try {
          const result = await api("/api/params", {
            method: "POST",
            body: { ...body, params: editor.params },
          });
          editor.params = result.params;
          if (body.action === "preset") editor.preset = body.preset;
          // A new parameter set deserves fresh noise.
          editor.seed = randomSeed();
          syncEditor();
          schedulePreview({ play: true, delay: 0 });
        } catch (error) {
          editorStatus(error.message, true);
        }
      }

      async function saveEditor({ asNew = false } = {}) {
        if (!editor) return;
        const name = $("ed-name").value.trim() || "sound";
        const group = $("ed-group").value.trim();
        editorStatus("saving…");
        try {
          let entry;
          if (asNew || !editor.id) {
            const result = await api("/api/save", {
              method: "POST",
              body: {
                params: editor.params,
                name,
                group,
                preset: editor.preset,
                seed: editor.seed ?? undefined,
              },
            });
            entry = result.sounds[0];
          } else {
            entry = await api(`/api/sounds/${encodeURIComponent(editor.id)}`, {
              method: "PATCH",
              body: {
                name,
                group,
                params: editor.params,
                seed: editor.seed ?? undefined,
              },
            });
          }

          editor.id = entry.id;
          editor.name = entry.name;
          editor.group = entry.group || "";
          editor.seed = entry.seed ?? null;
          editor.baseline = JSON.stringify(editor.params);
          $("ed-name").value = entry.name;
          fresh.add(entry.id);
          syncEditor();
          editorStatus(`saved · ${entry.file}`);
          await refresh();
        } catch (error) {
          editorStatus(error.message, true);
        }
      }

      /* ---------------------------------------------------------- events */

      $("generate").onclick = () => generate();
      $("prompt").onkeydown = (event) => {
        if (event.key === "Enter") generate();
      };
      $("search").oninput = render;
      $("group-filter").onchange = render;
      $("volume").oninput = () => setVolume($("volume").value);
      $("mute").onclick = () =>
        setVolume(audio.volume === 0 ? lastVolume || 1 : 0);

      $("select-all").onclick = () => {
        const ids = visibleSounds().map((s) => s.id);
        const allSelected = ids.every((id) => selected.has(id));
        for (const id of ids) {
          if (allSelected) selected.delete(id);
          else selected.add(id);
        }
        render();
      };

      $("zip").onclick = () => downloadZip([...selected], "bfxr-pack");

      $("bulk-group").onclick = async () => {
        const group = prompt("Move selected sounds to group:", $("group").value);
        if (group === null) return;
        for (const id of [...selected]) {
          await api(`/api/sounds/${encodeURIComponent(id)}`, {
            method: "PATCH",
            body: { group: group.trim() },
          });
        }
        await refresh();
      };

      $("bulk-delete").onclick = async () => {
        if (!confirm(`Delete ${selected.size} sound(s)? This removes the files.`))
          return;
        for (const id of [...selected]) {
          await api(`/api/sounds/${encodeURIComponent(id)}`, { method: "DELETE" });
        }
        selected.clear();
        await refresh();
      };

      $("new-sound").onclick = () => openEditor();

      $("import").onclick = async () => {
        const text = prompt(
          "Paste a bfxr.net link, or the contents of a .bfxr file:",
        );
        if (!text) return;
        try {
          const result = await api("/api/import", {
            method: "POST",
            body: { text },
          });
          openEditor({ name: result.name, params: result.params });
        } catch (error) {
          showError(error);
        }
      };

      $("ed-close").onclick = () => closeEditor();
      $("overlay").onmousedown = (event) => {
        if (event.target === $("overlay")) closeEditor();
      };
      $("ed-play").onclick = () =>
        preview.paused ? playPreview() : preview.pause();
      $("ed-wave").onclick = () => playPreview();
      $("ed-random").onclick = () => rollParams({ action: "randomize" });
      $("ed-mutate").onclick = () => rollParams({ action: "mutate", amount: 0.15 });
      $("ed-default").onclick = () => rollParams({ action: "reset" });
      $("ed-revert").onclick = () => {
        if (!editor) return;
        editor.params = JSON.parse(editor.baseline);
        $("ed-name").value = editor.name;
        $("ed-group").value = editor.group || "";
        syncEditor();
        schedulePreview({ play: true, delay: 0 });
      };
      $("ed-save").onclick = () => saveEditor();
      $("ed-saveas").onclick = () => saveEditor({ asNew: true });
      $("ed-name").oninput = syncEditor;
      $("ed-group").oninput = syncEditor;
      $("ed-copy").onclick = async () => {
        if (!previewSound) return;
        try {
          await navigator.clipboard.writeText(previewSound.permalink);
          editorStatus("link copied");
        } catch {
          editorStatus("could not copy — use the bfxr.net button", true);
        }
      };

      window.addEventListener("resize", () => {
        if (editor) drawScope();
      });

      document.addEventListener("keydown", (event) => {
        if (editor) {
          const active = document.activeElement;
          const typing =
            active &&
            (active.tagName === "TEXTAREA" ||
              (active.tagName === "INPUT" && active.type !== "range"));
          if (event.key === "Escape") {
            event.preventDefault();
            closeEditor();
            return;
          }
          if ((event.metaKey || event.ctrlKey) && event.key === "s") {
            event.preventDefault();
            saveEditor();
            return;
          }
          if (event.key === " " && !typing) {
            event.preventDefault();
            preview.paused ? playPreview() : preview.pause();
          }
          return;
        }
        if (event.key === "Escape") stop();
        if (event.key === "/" && document.activeElement !== $("prompt")) {
          event.preventDefault();
          $("search").focus();
        }
      });

      const storedVolume = readStoredVolume();
      lastVolume = storedVolume || 1;
      setVolume(storedVolume, { persist: false });
      refresh().catch(showError);
      setInterval(pollLibrary, 1500);
      document.addEventListener("visibilitychange", () => {
        if (!document.hidden) pollLibrary();
      });
    </script>
  </body>
</html>
